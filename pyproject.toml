[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "proofflow-ai"
version = "0.1.0"
description = "Evidence-based, human-approved AI workflow execution for invoices"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "pydantic>=2,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "nbformat>=5,<6", "pandas>=2,<3", "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
proofflow = ["static/*.html"]
